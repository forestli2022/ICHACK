<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard | OpenRouter AI</title>
  <script>window.tailwindConfig = { darkMode: 'class' };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
    select option { color: #000 !important; background: #fff !important; }
    .dark select option { color: #fff !important; background: #1f2937 !important; }
    @media print { 
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, target: 0.90, commonMistakes: ["th","sh"], wordsPracticed: 120, history: [65, 72, 68, 79, 82] },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.55, target: 0.85, commonMistakes: ["s","ch"], wordsPracticed: 95, history: [80, 75, 72, 68, 65] },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, target: 0.95, commonMistakes: ["r","l"], wordsPracticed: 150, history: [70, 75, 80, 85, 88] },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, target: 0.80, commonMistakes: ["a","i"], wordsPracticed: 110, history: [72, 74, 73, 72, 73] },
  { id: 5, name: "Eva Patel", progress: 0.82, accuracy: 0.90, target: 0.95, commonMistakes: ["th","s"], wordsPracticed: 140, history: [80, 82, 85, 87, 90] },
];

function App() {
  const [step, setStep] = useState('auth');
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("teacher_ai_key") || "");
  const [selectedModel, setSelectedModel] = useState("google/gemini-2.0-flash-001");
  const [students] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedStudents, setSelectedStudents] = useState([]);
  const [aiResponse, setAiResponse] = useState("");
  const [isGenerating, setIsGenerating] = useState(false);
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  useEffect(() => { localStorage.setItem("teacher_ai_key", apiKey); }, [apiKey]);
  useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);

  const callAI = async (sound) => {
    if (!apiKey) return alert("Please add your OpenRouter key in the login screen.");
    setIsGenerating(true);
    setAiResponse("");
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json", 
          "Authorization": `Bearer ${apiKey}`,
          "HTTP-Referer": window.location.href,
          "X-Title": "Teacher Pro Dashboard"
        },
        body: JSON.stringify({
          model: selectedModel,
          messages: [
            { role: "system", content: "You are an expert phonics coach using Science of Reading principles." },
            { role: "user", content: `Create a 5-minute multisensory activity for ${selectedStudent.name} struggling with /${sound}/.` }
          ]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "OpenRouter Error");
      setAiResponse(data.choices[0].message.content);
    } catch (e) {
      setAiResponse(`⚠️ Error: ${e.message}`);
    }
    setIsGenerating(false);
  };

  const toggleSelection = (id) => {
    setSelectedStudents(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
  };

  if (step === 'auth') {
    return (
      <div className="min-h-screen flex items-center justify-center bg-blue-50 dark:bg-gray-950 p-6">
        <div className="bg-white dark:bg-gray-900 p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border dark:border-gray-800 text-center">
          <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white text-3xl font-black italic">P</div>
          <h2 className="text-3xl font-black mb-8 tracking-tight">Teacher Login</h2>
          <div className="space-y-4">
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" className="w-5 h-5" /> Google
            </button>
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" className="w-5 h-5" /> Microsoft
            </button>
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">Email Access</button>
          </div>
        </div>
      </div>
    );
  }

  if (step === 'ai-setup') {
    return (
      <div className="min-h-screen flex items-center justify-center bg-blue-50 dark:bg-gray-950 p-6">
        <div className="bg-white dark:bg-gray-900 p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border dark:border-gray-800">
          <h2 className="text-2xl font-black mb-4 flex items-center gap-2">🔗 OpenRouter Config</h2>
          <p className="text-sm text-gray-500 mb-6 font-medium">Connect your OpenRouter key to unlock AI-powered interventions.</p>
          <div className="space-y-6">
            <div className="space-y-2">
              <label className="text-[10px] font-black uppercase text-gray-400 px-1 tracking-widest">API Key</label>
              <input 
                type="password" 
                placeholder="sk-or-v1-..." 
                value={apiKey} 
                onChange={e => setApiKey(e.target.value)}
                className="w-full bg-gray-50 dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              />
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={() => setStep('dashboard')} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">
                Finish Setup
              </button>
              <button onClick={() => { setApiKey(""); setStep('dashboard'); }} className="w-full py-4 text-gray-400 font-bold hover:text-gray-600 transition-all">
                Skip AI for now
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontSize }} className={`max-w-7xl mx-auto p-4 md:p-8 ${colorblindMode !== 'normal' ? colorblindMode : ''}`}>
      <nav className="no-print flex flex-wrap items-center justify-between gap-4 mb-8 bg-white dark:bg-gray-900 p-4 rounded-3xl border dark:border-gray-800 shadow-sm">
        <div className="flex items-center gap-4">
          <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-1.5 text-xs font-bold border-none outline-none">
            <option value="normal">Standard View</option>
            <option value="protanopia">Protanopia</option>
            <option value="deuteranopia">Deuteranopia</option>
            <option value="tritanopia">Tritanopia</option>
          </select>
          <select value={fontSize} onChange={e => setFontSize(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-1.5 text-xs font-bold border-none">
            <option value="14px">Small Text</option>
            <option value="16px">Normal Text</option>
            <option value="20px">Large Text</option>
          </select>
          <button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full">{darkMode ? '☀️' : '🌙'}</button>
          <button onClick={() => {setApiKey(""); setStep('auth');}} className="text-[10px] font-black text-gray-400 hover:text-red-500 uppercase ml-4">Reset Dashboard</button>
        </div>
        <button onClick={() => setStep('auth')} className="px-4 py-2 bg-red-50 dark:bg-red-900/20 text-red-600 font-black text-xs rounded-xl uppercase tracking-widest">Logout</button>
      </nav>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside className="no-print lg:col-span-3">
          <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 border dark:border-gray-800 shadow-sm sticky top-8">
            <input type="text" placeholder="Search Roster..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-3 text-sm mb-6 outline-none focus:ring-2 focus:ring-blue-500" />
            <div className="space-y-2 mb-6 max-h-[50vh] overflow-y-auto custom-scroll pr-2">
              {students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase())).map(s => (
                <div key={s.id} className="flex items-center gap-3">
                  <input type="checkbox" checked={selectedStudents.includes(s.id)} onChange={() => toggleSelection(s.id)} className="w-4 h-4 rounded border-gray-300 text-blue-600" />
                  <button onClick={() => setSelectedId(s.id)} className={`flex-1 flex items-center p-2.5 rounded-xl text-sm font-bold transition-all ${selectedId === s.id ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600' : 'hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                    <div className={`w-2 h-2 rounded-full mr-3 ${s.accuracy < 0.6 ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]'}`}></div>
                    <span className="truncate">{s.name}</span>
                  </button>
                </div>
              ))}
            </div>
            {selectedStudents.length > 0 && (
              <button className="w-full py-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-500/30">
                Bulk Group Activity ({selectedStudents.length})
              </button>
            )}
          </div>
        </aside>

        <main className="lg:col-span-9 space-y-8">
          <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 md:p-12 border dark:border-gray-800 shadow-sm">
            <div className="flex flex-col md:flex-row justify-between items-start gap-6 mb-12">
              <div>
                <h2 className="text-5xl font-black tracking-tighter">{selectedStudent.name}</h2>
                <div className="flex gap-2 mt-4">
                  {selectedStudent.commonMistakes.map(m => (
                    <span key={m} className="px-3 py-1 bg-red-50 dark:bg-red-900/20 text-red-600 text-[10px] font-black rounded-lg uppercase tracking-widest border border-red-100 dark:border-red-900/30">Focus: /{m}/</span>
                  ))}
                </div>
              </div>
              <button onClick={() => window.print()} className="no-print px-8 py-4 bg-gray-900 dark:bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-xl">Print Report</button>
            </div>

            {apiKey ? (
              <div className="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-800 p-8 rounded-[2rem] border-2 border-blue-100 dark:border-blue-900/30 mb-10">
                <div className="flex flex-wrap justify-between items-center gap-4 mb-6">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">✨</span>
                    <h3 className="text-xl font-black italic">OpenRouter AI Co-Pilot</h3>
                  </div>
                  <select 
                    value={selectedModel} 
                    onChange={(e) => setSelectedModel(e.target.value)}
                    className="bg-white dark:bg-gray-700 px-4 py-2 rounded-xl text-xs font-bold border dark:border-gray-600 outline-none"
                  >
                    <option value="google/gemini-2.0-flash-001">Gemini 2.0 (Fast)</option>
                    <option value="anthropic/claude-3.5-sonnet">Claude 3.5 (Smart)</option>
                    <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 (Balanced)</option>
                    <option value="openai/gpt-4o">GPT-4o (Pro)</option>
                  </select>
                </div>
                <div className="flex flex-wrap gap-3 mb-8">
                  {selectedStudent.commonMistakes.map(m => (
                    <button key={m} onClick={() => callAI(m)} disabled={isGenerating} className="px-6 py-3 bg-white dark:bg-gray-700 rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-sm hover:shadow-md transition-all disabled:opacity-50 border dark:border-gray-600">
                      Gen /{m}/ Plan
                    </button>
                  ))}
                </div>
                {isGenerating && <div className="text-blue-600 animate-pulse font-black uppercase text-[10px] tracking-widest">Consulting {selectedModel.split('/')[1]}...</div>}
                {aiResponse && (
                  <div className="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl whitespace-pre-line text-sm border dark:border-gray-700 border-t-4 border-t-blue-500">
                    {aiResponse}
                  </div>
                )}
              </div>
            ) : (
              <div className="p-8 border-2 border-dashed dark:border-gray-800 rounded-[2rem] text-center mb-10">
                <button onClick={() => setStep('ai-setup')} className="text-blue-500 font-bold text-sm hover:underline">Add OpenRouter Key to unlock interventions</button>
              </div>
            )}

            <div className="mb-12">
              <h4 className="text-[10px] font-black uppercase text-gray-400 mb-6 tracking-widest px-1">Accuracy Growth Trend</h4>
              <div className="bg-gray-50 dark:bg-gray-800/40 p-8 rounded-[2rem] border dark:border-gray-700">
                <svg viewBox="0 0 400 100" className="w-full h-32 overflow-visible">
                  <path d={selectedStudent.history.map((v, i) => `${i === 0 ? 'M' : 'L'} ${(i * 100)},${100 - v}`).join(' ')} fill="none" stroke="#3b82f6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
                  {selectedStudent.history.map((v, i) => (
                    <g key={i}>
                      <circle cx={i*100} cy={100-v} r="5" fill="#3b82f6" className="cursor-pointer transition-all hover:r-7 shadow-lg"/>
                      <text x={i*100} y={100-v-15} textAnchor="middle" fontSize="10" fontWeight="bold" fill="currentColor">{v}%</text>
                    </g>
                  ))}
                </svg>
                <div className="flex justify-between mt-6 text-[9px] font-black text-gray-400 uppercase tracking-widest">
                  <span>Start</span>
                  <span>Checkpoint 2</span>
                  <span>Checkpoint 3</span>
                  <span>Checkpoint 4</span>
                  <span>Latest Probe</span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Mastery Goal</p>
                <div className="flex items-baseline gap-2">
                  <p className="text-4xl font-black">{Math.round(selectedStudent.accuracy * 100)}%</p>
                  <p className="text-sm font-bold text-gray-400">/ {Math.round(selectedStudent.target * 100)}%</p>
                </div>
                <div className="w-full h-2 bg-gray-100 dark:bg-gray-800 mt-4 rounded-full overflow-hidden">
                  <div className="h-full bg-emerald-500 transition-all duration-1000" style={{width: `${(selectedStudent.accuracy / selectedStudent.target) * 100}%`}}></div>
                </div>
              </div>
              <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Total Words</p>
                <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
              </div>
              <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Trend Status</p>
                <p className={`text-2xl font-black uppercase italic ${selectedStudent.accuracy < 0.6 ? 'text-red-500' : 'text-emerald-500'}`}>
                  {selectedStudent.accuracy < 0.6 ? 'Review Needed' : 'Improving'}
                </p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
