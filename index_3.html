<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro | Secure AI Dashboard</title>
  <script>window.tailwindConfig = { darkMode: 'class' };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
    select option { color: #000 !important; background: #fff !important; }
    .dark select option { color: #fff !important; background: #1f2937 !important; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ... (initialStudents data stays the same)
const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, target: 0.90, commonMistakes: ["th","sh"], wordsPracticed: 120, history: [65, 72, 68, 79, 82] },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.65, target: 0.85, commonMistakes: ["s","ch"], wordsPracticed: 95, history: [80, 75, 72, 68, 65] },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, target: 0.95, commonMistakes: ["r","l"], wordsPracticed: 150, history: [70, 75, 80, 85, 88] },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, target: 0.80, commonMistakes: ["a","i"], wordsPracticed: 110, history: [72, 74, 73, 72, 73] },
];

function App() {
  // PERSISTENCE LOGIC: Check localStorage for key on load
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("teacher_ai_key") || "");
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [students] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedStudents, setSelectedStudents] = useState([]);
  const [aiResponse, setAiResponse] = useState("");
  const [isGenerating, setIsGenerating] = useState(false);
  
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  // Save key to local storage when it changes
  useEffect(() => {
    localStorage.setItem("teacher_ai_key", apiKey);
  }, [apiKey]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  const callAI = async (sound) => {
    if (!apiKey) return alert("Please set your API key first.");
    setIsGenerating(true);
    try {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "system", content: "You are a phonic teacher." }, 
                     { role: "user", content: `5 min activity for ${selectedStudent.name} struggling with /${sound}/.` }]
        })
      });
      const data = await res.json();
      setAiResponse(data.choices[0].message.content);
    } catch (e) { setAiResponse("API Error. Please check your key."); }
    setIsGenerating(false);
  };

  if (!isLoggedIn) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-gray-950 p-6">
        <div className="bg-white dark:bg-gray-900 p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md border dark:border-gray-800">
          <h2 className="text-3xl font-black mb-8 text-center">Security Check</h2>
          <div className="space-y-6">
            <div className="p-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-2xl">
              <p className="text-xs text-amber-700 dark:text-amber-400 font-bold">⚠️ Safety Note: Your API key is stored in your browser's LocalStorage only. It is never sent to GitHub.</p>
            </div>
            <div className="space-y-2">
              <label className="text-[10px] font-black uppercase text-gray-400 px-2 tracking-widest">API Key</label>
              <input 
                type="password" 
                placeholder="sk-..." 
                value={apiKey} 
                onChange={e => setApiKey(e.target.value)}
                className="w-full bg-gray-50 dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 outline-none"
              />
            </div>
            <button onClick={() => setIsLoggedIn(true)} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black tracking-widest uppercase text-xs">Authorize Session</button>
          </div>
        </div>
      </div>
    );
  }

  // ... (Remainder of the dashboard UI from previous code stays fully intact)
  return (
    <div style={{ fontSize }} className={`max-w-7xl mx-auto p-4 md:p-8 ${colorblindMode !== 'normal' ? colorblindMode : ''}`}>
      <nav className="no-print flex flex-wrap items-center justify-between gap-4 mb-8 bg-white dark:bg-gray-900 p-4 rounded-3xl border dark:border-gray-800 shadow-sm">
        <div className="flex items-center gap-4">
          <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-1.5 text-xs font-bold">
            <option value="normal">Standard View</option>
            <option value="protanopia">Protanopia</option>
            <option value="deuteranopia">Deuteranopia</option>
            <option value="tritanopia">Tritanopia</option>
          </select>
          <button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full">{darkMode ? '☀️' : '🌙'}</button>
          <button onClick={() => setApiKey("")} className="text-[10px] font-black text-gray-400 hover:text-red-500 uppercase ml-4">Clear Key</button>
        </div>
        <button onClick={() => setIsLoggedIn(false)} className="px-4 py-2 bg-red-50 text-red-600 font-black text-xs rounded-xl">LOGOUT</button>
      </nav>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
        {/* SIDEBAR */}
        <aside className="no-print lg:col-span-3">
          <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 border dark:border-gray-800 shadow-sm sticky top-8">
            <input type="text" placeholder="Search..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-2 text-sm mb-6 outline-none" />
            <div className="space-y-2 mb-4">
              {students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase())).map(s => (
                <div key={s.id} className="flex items-center gap-3">
                  <input type="checkbox" checked={selectedStudents.includes(s.id)} onChange={() => {
                    setSelectedStudents(prev => prev.includes(s.id) ? prev.filter(i => i !== s.id) : [...prev, s.id]);
                  }} />
                  <button onClick={() => setSelectedId(s.id)} className={`flex-1 text-left p-2 rounded-xl text-sm font-bold ${selectedId === s.id ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600' : ''}`}>
                    {s.name}
                  </button>
                </div>
              ))}
            </div>
            {selectedStudents.length > 0 && (
              <button className="w-full py-3 bg-blue-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-500/30">
                Bulk Group ({selectedStudents.length})
              </button>
            )}
          </div>
        </aside>

        {/* MAIN DASHBOARD CONTENT */}
        <main className="lg:col-span-9 space-y-8">
          <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 md:p-12 border dark:border-gray-800 shadow-sm">
            <div className="flex justify-between items-start mb-10">
              <h2 className="text-5xl font-black tracking-tighter">{selectedStudent.name}</h2>
              <button onClick={() => window.print()} className="no-print px-6 py-3 border-2 dark:border-gray-700 rounded-2xl font-black text-xs uppercase tracking-widest">Print PDF</button>
            </div>

            {/* AI GEN BOX */}
            <div className="bg-blue-50 dark:bg-gray-800/50 p-8 rounded-[2rem] mb-10 border-2 border-blue-100 dark:border-blue-900/30">
              <div className="flex items-center gap-3 mb-6">
                <span className="text-2xl">🪄</span>
                <h3 className="text-xl font-black italic">Live AI Lesson Co-Pilot</h3>
              </div>
              <div className="flex gap-3 mb-8">
                {selectedStudent.commonMistakes.map(m => (
                  <button key={m} onClick={() => callAI(m)} disabled={isGenerating} className="px-6 py-3 bg-white dark:bg-gray-700 rounded-2xl font-bold text-xs shadow-sm hover:scale-105 transition-transform disabled:opacity-50 uppercase tracking-widest border border-blue-100 dark:border-gray-600">
                    Gen /{m}/
                  </button>
                ))}
              </div>
              {isGenerating && <div className="text-blue-600 animate-pulse font-black uppercase text-[10px] tracking-widest">Consulting Phonics Experts...</div>}
              {aiResponse && (
                <div className="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl whitespace-pre-line text-sm leading-relaxed border dark:border-gray-700 border-t-4 border-t-blue-500">
                  {aiResponse}
                </div>
              )}
            </div>

            {/* PROGRESS GRAPH */}
            <div className="mb-10">
              <h4 className="text-[10px] font-black uppercase text-gray-400 mb-6 tracking-widest">Growth Analytics</h4>
              <div className="bg-gray-50 dark:bg-gray-800/50 p-8 rounded-3xl border dark:border-gray-700">
                <svg viewBox="0 0 400 100" className="w-full h-32 overflow-visible">
                  <path d={selectedStudent.history.map((v, i) => `${i === 0 ? 'M' : 'L'} ${(i * 100)},${100 - v}`).join(' ')} fill="none" stroke="#3b82f6" strokeWidth="4" strokeLinecap="round"/>
                  {selectedStudent.history.map((v, i) => <circle key={i} cx={i*100} cy={100-v} r="5" fill="#3b82f6" className="cursor-pointer hover:r-7 transition-all"/>)}
                </svg>
                <div className="flex justify-between mt-6 text-[9px] font-black text-gray-400 uppercase tracking-[0.2em]">
                  <span>Initial Assessment</span>
                  <span>Latest Probe</span>
                </div>
              </div>
            </div>

            {/* QUICK STATS */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Mastery</p>
                <p className="text-4xl font-black">{Math.round(selectedStudent.accuracy * 100)}%</p>
                <div className="w-full h-1.5 bg-gray-100 dark:bg-gray-800 mt-4 rounded-full overflow-hidden">
                  <div className="h-full bg-blue-500" style={{width: `${selectedStudent.accuracy * 100}%`}}></div>
                </div>
              </div>
              <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Words</p>
                <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
              </div>
              <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Trend</p>
                <p className="text-2xl font-black text-emerald-500 uppercase tracking-tighter italic">📈 Improving</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
