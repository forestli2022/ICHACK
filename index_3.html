<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard</title>
  <script>
    window.tailwindConfig = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
    
    /* Fix for white-on-white text in dropdowns */
    select { color: inherit; background-color: transparent; }
    option { color: #000000 !important; background-color: #ffffff !important; }
    .dark option { color: #ffffff !important; background-color: #1f2937 !important; }

    /* Custom scrollbar for sidebar */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, target: 0.90, commonMistakes: ["th","sh","r"], wordsPracticed: 120, trend: 'up', history: [65, 70, 68, 75, 82] },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.65, target: 0.85, commonMistakes: ["s","ch","l"], wordsPracticed: 95, trend: 'down', history: [80, 75, 72, 68, 65] },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, target: 0.95, commonMistakes: ["r","l","ed"], wordsPracticed: 150, trend: 'up', history: [70, 75, 80, 85, 88] },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, target: 0.80, commonMistakes: ["a","i","o"], wordsPracticed: 110, trend: 'stable', history: [72, 74, 73, 72, 73] },
  { id: 5, name: "Eva Patel", progress: 0.82, accuracy: 0.90, target: 0.95, commonMistakes: ["th","s"], wordsPracticed: 140, trend: 'up', history: [80, 82, 85, 87, 90] },
  { id: 6, name: "Frank Lopez", progress: 0.49, accuracy: 0.48, target: 0.75, commonMistakes: ["ch","r"], wordsPracticed: 80, trend: 'down', history: [60, 55, 52, 50, 48] },
];

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [lastLogin, setLastLogin] = useState(null);
  const [students, setStudents] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [viewMode, setViewMode] = useState('students');
  const [sortBy, setSortBy] = useState('name');
  const [searchQuery, setSearchQuery] = useState("");
  
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  useEffect(() => {
    const body = document.body;
    body.classList.remove('protanopia', 'deuteranopia', 'tritanopia');
    if (colorblindMode !== 'normal') body.classList.add(colorblindMode);
  }, [colorblindMode]);

  const handleSignIn = () => {
    setLastLogin(new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
    setIsLoggedIn(true);
  };

  const filteredAndSortedStudents = useMemo(() => {
    let list = students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));
    if (sortBy === 'accuracy') return list.sort((a, b) => a.accuracy - b.accuracy);
    return list.sort((a, b) => a.name.localeCompare(b.name));
  }, [students, sortBy, searchQuery]);

  const groups = useMemo(() => {
    const map = {};
    students.forEach(s => {
      s.commonMistakes.forEach(m => {
        if (!map[m]) map[m] = [];
        map[m].push(s.name);
      });
    });
    return map;
  }, [students]);

  if (!isLoggedIn) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6 bg-blue-50 dark:bg-gray-950">
        <div className="max-w-md w-full bg-white dark:bg-gray-900 p-10 rounded-[2.5rem] shadow-2xl border dark:border-gray-800 text-center">
          <div className="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-8 flex items-center justify-center text-white text-4xl font-black shadow-xl shadow-blue-500/40">P</div>
          <h2 className="text-3xl font-black mb-2 tracking-tight">Teacher Portal</h2>
          <p className="text-gray-500 mb-10">Select your provider to continue</p>
          <div className="space-y-4">
            <button onClick={handleSignIn} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all active:scale-95">
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" className="w-5 h-5" /> Google
            </button>
            <button onClick={handleSignIn} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all active:scale-95">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" className="w-5 h-5" /> Microsoft
            </button>
            <button onClick={handleSignIn} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-600/30 hover:bg-blue-700">Email Login</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontSize }} className="max-w-7xl mx-auto p-4 md:p-8">
      {/* HEADER CONTROLS */}
      <nav className="bg-white dark:bg-gray-900 rounded-3xl p-4 shadow-sm border dark:border-gray-800 mb-8 flex flex-wrap items-center justify-between gap-6">
        <div className="flex flex-wrap items-center gap-6">
          <div className="flex items-center gap-3">
            <span className="text-[10px] font-black uppercase text-gray-400">Accessibility</span>
            <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-gray-50 dark:bg-gray-800 px-3 py-1.5 rounded-xl text-xs font-bold border dark:border-gray-700">
              <option value="normal">Default Colors</option>
              <option value="protanopia">Protanopia</option>
              <option value="deuteranopia">Deuteranopia</option>
              <option value="tritanopia">Tritanopia</option>
            </select>
            <select value={fontSize} onChange={e => setFontSize(e.target.value)} className="bg-gray-50 dark:bg-gray-800 px-3 py-1.5 rounded-xl text-xs font-bold border dark:border-gray-700">
              <option value="14px">Small Text</option>
              <option value="16px">Normal Text</option>
              <option value="20px">Large Text</option>
            </select>
          </div>
          <button onClick={() => setDarkMode(!darkMode)} className="w-10 h-10 flex items-center justify-center bg-gray-50 dark:bg-gray-800 rounded-full border dark:border-gray-700">
            {darkMode ? '☀️' : '🌙'}
          </button>
        </div>
        <div className="flex items-center gap-4">
          <div className="text-right hidden sm:block">
            <p className="text-[10px] font-black text-gray-400 uppercase">Authenticated</p>
            <p className="text-xs font-bold text-blue-500">{lastLogin}</p>
          </div>
          <button onClick={() => setIsLoggedIn(false)} className="px-5 py-2.5 bg-red-50 dark:bg-red-900/20 text-red-600 text-xs font-black rounded-xl hover:bg-red-100 transition-colors">SIGN OUT</button>
        </div>
      </nav>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
        {/* SIDEBAR */}
        <aside className="lg:col-span-3">
          <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 border dark:border-gray-800 shadow-sm sticky top-8">
            <input 
              type="text" 
              placeholder="Search Roster..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 rounded-2xl px-4 py-3 text-sm mb-6 outline-none focus:ring-2 focus:ring-blue-500"
            />
            <div className="flex items-center justify-between mb-4 px-2">
              <h3 className="text-[10px] font-black uppercase text-gray-400 tracking-widest">Students</h3>
              <select onChange={(e) => setSortBy(e.target.value)} className="text-[10px] font-black uppercase bg-transparent text-blue-500 outline-none cursor-pointer">
                <option value="name">Sort A-Z</option>
                <option value="accuracy">Sort Need</option>
              </select>
            </div>
            <div className="space-y-2 max-h-[50vh] overflow-y-auto custom-scroll pr-2">
              {filteredAndSortedStudents.map(s => (
                <button 
                  key={s.id} 
                  onClick={() => { setSelectedId(s.id); setViewMode('students'); }}
                  className={`w-full flex items-center p-3 rounded-2xl border-2 transition-all ${selectedId === s.id && viewMode === 'students' ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20' : 'border-transparent hover:bg-gray-50 dark:hover:bg-gray-800'}`}
                >
                  <div className={`w-2.5 h-2.5 rounded-full mr-3 ${s.accuracy < 0.6 ? 'bg-red-500' : s.accuracy < 0.8 ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                  <span className="font-bold text-sm truncate">{s.name}</span>
                </button>
              ))}
            </div>
            <button onClick={() => setViewMode('groups')} className={`w-full mt-6 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all ${viewMode === 'groups' ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-100 dark:bg-gray-800'}`}>
              Group Planner
            </button>
          </div>
        </aside>

        {/* MAIN */}
        <main className="lg:col-span-9">
          {viewMode === 'students' ? (
            <div className="space-y-8">
              <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 md:p-12 border dark:border-gray-800 shadow-sm">
                <div className="flex flex-col md:flex-row justify-between items-start gap-6 mb-12">
                  <div>
                    <span className="text-[10px] font-black text-blue-500 uppercase tracking-[0.3em]">Student Profile</span>
                    <h2 className="text-5xl font-black tracking-tighter mt-2">{selectedStudent.name}</h2>
                    <div className="flex gap-2 mt-4">
                      {selectedStudent.commonMistakes.map(m => (
                        <span key={m} className="px-3 py-1 bg-red-50 dark:bg-red-900/20 text-red-600 text-[10px] font-black rounded-lg uppercase tracking-tighter border border-red-100 dark:border-red-900/30">Focus: /{m}/</span>
                      ))}
                    </div>
                  </div>
                  <button onClick={() => alert("Report Copied!")} className="px-8 py-4 bg-gray-900 dark:bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 transition-transform active:scale-95 shadow-xl">Copy Parent Report</button>
                </div>

                {/* GRAPH */}
                <div className="p-8 bg-gray-50 dark:bg-gray-800/50 rounded-[2rem] border dark:border-gray-700 mb-10">
                  <div className="flex justify-between items-center mb-8">
                    <h3 className="text-xs font-black uppercase text-gray-400">Accuracy Trend History</h3>
                    <span className="text-xs font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-900/20 px-3 py-1 rounded-full">Overall: {Math.round(selectedStudent.accuracy*100)}%</span>
                  </div>
                  <div className="flex items-end justify-between h-40 gap-3">
                    {selectedStudent.history.map((val, i) => (
                      <div key={i} className="flex-1 flex flex-col items-center gap-3 group">
                        <div className="w-full bg-blue-100 dark:bg-gray-700 rounded-xl relative flex items-end overflow-hidden" style={{height: '100%'}}>
                          <div className="w-full bg-blue-600 transition-all duration-700" style={{height: `${val}%`}}></div>
                        </div>
                        <span className="text-[10px] font-black text-gray-400">Day {i+1}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                    <p className="text-[10px] font-black text-gray-400 uppercase mb-4">Mastery Goal</p>
                    <div className="flex items-baseline gap-2">
                      <p className="text-4xl font-black">{Math.round(selectedStudent.accuracy*100)}%</p>
                      <p className="text-sm font-bold text-gray-400">/ {Math.round(selectedStudent.target*100)}%</p>
                    </div>
                    <div className="w-full h-2 bg-gray-100 dark:bg-gray-800 rounded-full mt-4">
                      <div className="h-full bg-emerald-500 rounded-full" style={{width: `${(selectedStudent.accuracy / selectedStudent.target) * 100}%`}}></div>
                    </div>
                  </div>
                  <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                    <p className="text-[10px] font-black text-gray-400 uppercase mb-4">Volume</p>
                    <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
                    <p className="text-xs font-bold text-gray-400 mt-2">Total Words Read</p>
                  </div>
                  <div className="p-8 border-2 dark:border-gray-800 rounded-3xl">
                    <p className="text-[10px] font-black text-gray-400 uppercase mb-4">Trend Status</p>
                    <p className={`text-2xl font-black uppercase ${selectedStudent.trend === 'up' ? 'text-emerald-500' : 'text-red-500'}`}>
                      {selectedStudent.trend === 'up' ? '📈 Improving' : '📉 Review Needed'}
                    </p>
                  </div>
                </div>
              </div>

              {/* ACTIONABLE INTERVENTION */}
              <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 border dark:border-gray-800">
                <h3 className="text-lg font-black mb-6">Required Intervention</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {selectedStudent.commonMistakes.map(m => (
                    <div key={m} className="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl border dark:border-gray-700">
                      <span className="font-mono font-black text-xl">/{m}/</span>
                      <button className="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-600/20">Assign Phonics Lab</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-10 border dark:border-gray-800 shadow-sm">
              <h2 className="text-3xl font-black mb-8">Guided Reading Groups</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {Object.entries(groups).map(([sound, names]) => (
                  <div key={sound} className="p-8 border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-[2rem]">
                    <div className="flex justify-between items-center mb-6">
                      <h4 className="text-2xl font-mono font-black">/{sound}/</h4>
                      <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-[10px] font-black">{names.length} Students</span>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {names.map(n => <span key={n} className="bg-gray-100 dark:bg-gray-800 px-4 py-2 rounded-xl text-sm font-bold border dark:border-gray-700">{n}</span>)}
                    </div>
                    <button className="w-full mt-6 py-3 border-2 border-blue-600 text-blue-600 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition-all">Print Lesson Material</button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
