<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard | OpenRouter Suite</title>
  <script>window.tailwindConfig = { darkMode: 'class' };</script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
    select option { color: #000 !important; background: #fff !important; }
    .dark select option { color: #fff !important; background: #1f2937 !important; }
    @media print { 
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

</head>

  { id: 22, name: "Violet Adams", progress: 0.77, accuracy: 0.75, target: 0.88, commonMistakes: ["ai","ay"], mastered: ["s", "a", "t", "p", "i", "n", "m", "d"], wordsPracticed: 145, history: [65, 68, 70, 72, 75] },
  { id: 23, name: "Will Henderson", progress: 0.35, accuracy: 0.32, target: 0.75, commonMistakes: ["w","wh"], mastered: ["m", "s", "t"], wordsPracticed: 50, history: [30, 28, 32, 30, 32] },

  { id: 26, name: "Zane Taylor", progress: 0.50, accuracy: 0.46, target: 0.80, commonMistakes: ["z","s"], mastered: ["s", "a", "t", "p"], wordsPracticed: 80, history: [40, 42, 45, 48, 46] },
  { id: 27, name: "Amy Zhang", progress: 0.98, accuracy: 0.97, target: 0.99, commonMistakes: ["none"], mastered: ["all-kindergarten", "all-first-grade"], wordsPracticed: 450, history: [92, 94, 96, 97, 97] },
  { id: 28, name: "Bobby Evans", progress: 0.25, accuracy: 0.20, target: 0.70, commonMistakes: ["all-vowels"], mastered: ["m"], wordsPracticed: 30, history: [25, 20, 18, 22, 20] },
  { id: 29, name: "Carly Simon", progress: 0.73, accuracy: 0.70, target: 0.85, commonMistakes: ["oi","oy"], mastered: ["s", "a", "t", "p", "i", "n", "m", "d"], wordsPracticed: 125, history: [60, 62, 65, 68, 70] },
  { id: 30, name: "David Miller", progress: 0.60, accuracy: 0.55, target: 0.80, commonMistakes: ["ending-s"], mastered: ["s", "a", "t", "p", "i", "n"], wordsPracticed: 95, history: [50, 52, 54, 56, 55] }
];


function App() {
  const [step, setStep] = useState('auth');
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("teacher_ai_key") || "");
  const [selectedModel, setSelectedModel] = useState("google/gemini-2.0-flash-001");
  const [students] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedStudents, setSelectedStudents] = useState([]);
  const [aiResponse, setAiResponse] = useState("");
  const [isGenerating, setIsGenerating] = useState(false);
  const [apiStatus, setApiStatus] = useState("idle"); 
  const [rawNotes, setRawNotes] = useState("");
  const [copied, setCopied] = useState(false);
  
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  useEffect(() => { localStorage.setItem("teacher_ai_key", apiKey); }, [apiKey]);
  useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);

  // MOVE HOOK ABOVE ANY CONDITIONAL RETURNS (fixes blank screen)
  const rosterStats = useMemo(() => {
    const total = students.length;
    const urgent = students.filter(s => s.accuracy < 0.6).length;
    const onTrack = students.filter(s => s.accuracy >= 0.8).length;
    const avgAccuracy = Math.round((students.reduce((acc, s) => acc + s.accuracy, 0) / total) * 100);
    return { total, urgent, onTrack, avgAccuracy };
  }, [students]);

  const checkStatus = async () => {
    if (!apiKey) return alert("Enter a key first!");
    setApiStatus("checking");
    try {
      const res = await fetch("https://openrouter.ai/api/v1/auth/key", {
        method: "GET",
        headers: { "Authorization": `Bearer ${apiKey.trim()}` }
      });
      const data = await res.json();
      if (data.data) setApiStatus("success");
      else setApiStatus("error");
    } catch (e) { 
      setApiStatus("error"); 
      console.error(e);
    }
  };

  const callAI = async (type, val) => {
    if (!apiKey) return alert("Please add your OpenRouter key.");
    setIsGenerating(true);
    setAiResponse("");
    
    let prompt = "";
    if (type === 'lesson') {
        prompt = `Design a 5-minute multisensory activity for ${selectedStudent.name} focusing on the /${val}/ sound. Include one tactile element.`;
    } else if (type === 'story') {
        prompt = `Write a short decodable story (max 50 words) for ${selectedStudent.name}. Use these mastered sounds: [${selectedStudent.mastered.join(", ")}] and include the target sound /${val}/.`;
    } else if (type === 'group') {
        const studentNames = students.filter(s => selectedStudents.includes(s.id)).map(s => s.name).join(", ");
        prompt = `Create a collaborative small-group phonics game for these students: ${studentNames}. The game should allow them to practice different target sounds simultaneously.`;
    } else if (type === 'parent') {
        prompt = `Write a warm, professional, jargon-free 3-sentence update for the parents of ${selectedStudent.name}. Mention they are working on /${val}/ and give one simple tip for home practice that doesn't require extra materials.`;
    } else if (type === 'heart') {
        prompt = `Identify 5 'Heart Words' (high-frequency irregular words) that align with ${selectedStudent.name}'s current level. Explain which part of the word must be 'learned by heart'.`;
    } else if (type === 'translate') {
      prompt = `Translate these raw classroom observations into a professional, clinical progress report paragraph for ${selectedStudent.name}: "${val}" 
      Guidelines: Use Science of Reading terminology (e.g., phonemic awareness, orthographic mapping, decoding). Stay objective and professional.`;
    } else if (type === 'goal') {
      prompt = `Write a SMART IEP goal for ${selectedStudent.name}. 
      Current Accuracy: ${Math.round(selectedStudent.accuracy * 100)}%
      Target Accuracy: ${Math.round(selectedStudent.target * 100)}%
      Specific Weaknesses: ${selectedStudent.commonMistakes.join(", ")}
      
      Format: "By [Date], when given [Condition], the student will [Action] with [Criteria] accuracy over [Consistency]."`;
    } else if (type === 'wordlist') {
      prompt = `Generate a 'Strictly Decodable' practice set for ${selectedStudent.name}.
      Target Sound: /${val}/
      Allowed Mastered Sounds: ${selectedStudent.mastered.join(", ")}
      
      Provide:
      1. A list of 10 words using ONLY the target sound and allowed sounds.
      2. 3 short sentences using those words.
      3. One 'Challenge Word'.
      
      If a word contains a sound NOT in the allowed list, do not use it.`;
    } else if (type === 'anchor') {
      prompt = `Create a multisensory anchor mnemonic for the sound /${val}/. 
      Include: 
      1. A Visual Anchor (e.g., 'S looks like a Snake'). 
      2. A Kinesthetic Gesture (e.g., 'Slither your hand in an S shape'). 
      3. An Alliterative Catchphrase using only simple decodable words.`;
    }

    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json", 
          "Authorization": `Bearer ${apiKey.trim()}`
        },
        body: JSON.stringify({
          model: selectedModel,
          messages: [
            { role: "system", content: "You are an expert literacy interventionist specializing in the Science of Reading." },
            { role: "user", content: prompt }
          ]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      setAiResponse(data.choices?.[0]?.message?.content || "No response returned.");
    } catch (e) { 
      setAiResponse(`⚠️ Error: ${e.message}`); 
    }
    setIsGenerating(false);
  };

  const copyToClipboard = () => {
    if (!aiResponse) return;
    navigator.clipboard.writeText(aiResponse).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const toggleSelection = (id) => {
    setSelectedStudents(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
  };

  if (step === 'auth') {
    return (
      <div className="min-h-screen flex items-center justify-center bg-blue-50 dark:bg-gray-950 p-6">
        <div className="bg-white dark:bg-gray-900 p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border dark:border-gray-800 text-center">
          <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white text-3xl font-black italic">P</div>
          <h2 className="text-3xl font-black mb-8 tracking-tight">Teacher Login</h2>
          <div className="space-y-4">
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
              <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" className="w-5 h-5" /> Google
            </button>
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" className="w-5 h-5" /> Microsoft
            </button>
            <button onClick={() => setStep('ai-setup')} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">Email Access</button>
          </div>
        </div>
      </div>
    );
  }

  if (step === 'ai-setup') {
    return (
      <div className="min-h-screen flex items-center justify-center bg-blue-50 dark:bg-gray-950 p-6">
        <div className="bg-white dark:bg-gray-900 p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border dark:border-gray-800">
          <h2 className="text-2xl font-black mb-4 flex items-center gap-2">🔗 OpenRouter Key</h2>
          <p className="text-sm text-gray-500 mb-6 font-medium">Connect your AI to generate personalized phonics lesson plans and decodable stories.</p>
          <div className="space-y-6">
            <div className="space-y-2">
              <label className="text-[10px] font-black uppercase text-gray-400 px-1">API Key</label>
              <input 
                type="password" 
                placeholder="sk-or-v1-..." 
                value={apiKey} 
                onChange={e => setApiKey(e.target.value)}
                className="w-full bg-gray-50 dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              />
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={() => setStep('dashboard')} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">
                Enter Dashboard
              </button>
              <button onClick={() => { setApiKey(""); setStep('dashboard'); }} className="w-full py-4 text-gray-400 font-bold hover:text-gray-600 transition-all">
                Skip AI Features
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (step === 'dashboard') {
    return (
      <div style={{ fontSize }} className={`max-w-7xl mx-auto p-4 md:p-8 ${colorblindMode !== 'normal' ? colorblindMode : ''}`}>
        <nav className="no-print flex flex-wrap items-center justify-between gap-4 mb-8 bg-white dark:bg-gray-900 p-4 rounded-3xl border dark:border-gray-800 shadow-sm">
          <div className="flex items-center gap-4">
            <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-1.5 text-xs font-bold border-none outline-none">
              <option value="normal">Standard View</option>
              <option value="protanopia">Protanopia</option>
              <option value="deuteranopia">Deuteranopia</option>
              <option value="tritanopia">Tritanopia</option>
            </select>
            <select value={fontSize} onChange={e => setFontSize(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-1.5 text-xs font-bold border-none">
              <option value="14px">Small</option>
              <option value="20px">Normal</option>
              <option value="28px">Large</option>
            </select>
            <button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full">{darkMode ? '☀️' : '🌙'}</button>
            <button onClick={() => {setApiKey(""); setStep('auth');}} className="text-[20px] font-black text-gray-400 hover:text-red-500 uppercase ml-4 tracking-tighter">Reset Session</button>
          </div>
          <button onClick={() => setStep('auth')} className="px-4 py-2 bg-red-50 dark:bg-red-900/20 text-red-600 font-black text-xs rounded-xl uppercase tracking-widest">Logout</button>
        </nav>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          <aside className="no-print lg:col-span-3">
            <div className="grid grid-cols-2 gap-2 mb-6">
              <div className="p-3 bg-red-50 dark:bg-red-900/20 rounded-2xl border border-red-100 dark:border-red-800">
                <p className="text-[8px] font-black text-red-600 uppercase tracking-widest">Urgent Review</p>
                <p className="text-xl font-black text-red-700 dark:text-red-400">{rosterStats.urgent}</p>
              </div>
              <div className="p-3 bg-emerald-50 dark:bg-emerald-900/20 rounded-2xl border border-emerald-100 dark:border-emerald-800">
                <p className="text-[8px] font-black text-emerald-600 uppercase tracking-widest">On Track</p>
                <p className="text-xl font-black text-emerald-700 dark:text-emerald-400">{rosterStats.onTrack}</p>
              </div>
              <div className="col-span-2 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-2xl border border-blue-100 dark:border-blue-800 flex justify-between items-center">
                <p className="text-[8px] font-black text-blue-600 uppercase tracking-widest">Class Average</p>
                <p className="text-sm font-black text-blue-700 dark:text-blue-400">{rosterStats.avgAccuracy}%</p>
              </div>
            </div>
            <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 border dark:border-gray-800 shadow-sm sticky top-8">
              <input type="text" placeholder="Search students..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-3 text-sm mb-6 outline-none focus:ring-2 focus:ring-blue-500" />
              <div className="space-y-2 mb-6 max-h-[50vh] overflow-y-auto custom-scroll pr-2">
                {students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase())).map(s => (
                  <div key={s.id} className="flex items-center gap-3 group">
                    <input type="checkbox" checked={selectedStudents.includes(s.id)} onChange={() => toggleSelection(s.id)} className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                    <button onClick={() => setSelectedId(s.id)} className={`flex-1 flex items-center p-2.5 rounded-xl text-sm font-bold transition-all ${selectedId === s.id ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600' : 'hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                      <div className={`w-2 h-2 rounded-full mr-3 ${s.accuracy < 0.6 ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]'}`}></div>
                      <span className="truncate">{s.name}</span>
                    </button>
                  </div>
                ))}
              </div>
              {selectedStudents.length > 0 && (
                <button onClick={() => callAI('group')} className="w-full py-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-500/30">
                  Bulk Action ({selectedStudents.length})
                </button>
              )}
            </div>
          </aside>

          <main className="lg:col-span-9 space-y-8">
            <div className="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 md:p-12 border dark:border-gray-800 shadow-sm">
              <div className="flex flex-col md:flex-row justify-between items-start gap-6 mb-12">
                <div>
                  <h2 className="text-5xl font-black tracking-tighter">{selectedStudent.name}</h2>
                  <div className="flex flex-wrap gap-2 mt-4">
                    {selectedStudent.commonMistakes.map(m => (
                      <span key={m} className="px-3 py-1 bg-red-50 dark:bg-red-900/20 text-red-600 text-[10px] font-black rounded-lg uppercase tracking-widest border border-red-100 dark:border-red-900/30">Target: /{m}/</span>
                    ))}
                    <span className="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 text-[10px] font-black rounded-lg uppercase tracking-widest border border-emerald-100 dark:border-emerald-900/30">Mastered: {selectedStudent.mastered.length}</span>
                  </div>
                </div>
                <button onClick={() => window.print()} className="no-print px-8 py-4 bg-gray-900 dark:bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-xl">Print Report</button>
              </div>

              {/* CLINICAL TRANSLATOR BOX */}
              <div className="bg-amber-50 dark:bg-gray-800/40 p-8 rounded-[2rem] border-2 border-amber-100 dark:border-amber-900/30 mb-10">
                <div className="flex items-center gap-3 mb-4">
                  <span className="text-2xl">📋</span>
                  <h3 className="text-xl font-black italic">Clinical Report Translator</h3>
                </div>
                <p className="text-[10px] font-black text-amber-600 dark:text-amber-400 uppercase tracking-widest mb-4">
                  Convert raw notes into professional report language:
                </p>
                <textarea 
                  value={rawNotes}
                  onChange={(e) => setRawNotes(e.target.value)}
                  placeholder="Example: Alice was guessing words based on the first letter today and struggled with the sh/ch distinction..."
                  className="w-full bg-white dark:bg-gray-900 rounded-2xl p-4 text-sm min-h-[100px] outline-none border border-amber-200 dark:border-gray-700 mb-4"
                />
                <button 
                  onClick={() => callAI('translate', rawNotes)}
                  disabled={isGenerating || !rawNotes}
                  className="px-6 py-3 bg-amber-600 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-amber-700 disabled:opacity-50 transition-all"
                >
                  {isGenerating ? 'Translating...' : 'Generate Professional Report'}
                </button>
              </div>

              {apiKey ? (
                <div className="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-800 p-8 rounded-[2rem] border-2 border-blue-100 dark:border-blue-900/30 mb-10">
                  <div className="flex flex-wrap justify-between items-center gap-4 mb-6">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">✨</span>
                      <h3 className="text-xl font-black italic">AI Co-Pilot</h3>
                      <button onClick={checkStatus} className={`ml-2 px-3 py-1 rounded-full text-[18px] font-black uppercase tracking-tighter ${apiStatus === 'success' ? 'bg-emerald-500 text-white' : apiStatus === 'error' ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-500'}`}>
                        {apiStatus === 'idle' ? 'Check Connection' : apiStatus === 'checking' ? 'Pinging...' : apiStatus === 'success' ? 'Connected' : 'Auth Error'}
                      </button>
                    </div>
                    <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)} className="bg-white dark:bg-gray-700 px-4 py-2 rounded-xl text-xs font-bold border dark:border-gray-600">
                      <option value="google/gemini-2.0-flash-001">Gemini 2.0 (Fastest)</option>
                      <option value="openai/gpt-4o-mini">GPT-4o Mini (Recommended)</option>
                    </select>
                  </div>
                  
                  <div className="space-y-4">
                    <p className="text-[10px] font-black text-blue-600 uppercase tracking-widest">Intervention Tools:</p>
                    {selectedStudent.commonMistakes.map(m => (
                      <div key={m} className="flex flex-wrap gap-2">

                        <button onClick={() => callAI('lesson', m)} disabled={isGenerating} className="px-5 py-2.5 bg-white dark:bg-gray-700 rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm border border-blue-200">
                          Lesson: /{m}/
                        </button>

                        <button onClick={() => callAI('story', m)} disabled={isGenerating} className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm">
                          Story: /{m}/
                        </button>

                        <button onClick={() => callAI('parent', m)} className="px-4 py-2 bg-emerald-600 text-white rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm">
                          📩 Parent Update
                        </button>

                        <button onClick={() => callAI('heart', m)} className="px-4 py-2 bg-amber-600 text-white rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm">
                          ❤️ Heart Words
                        </button>

                        <button 
                          onClick={() => callAI('goal')} 
                          disabled={isGenerating}
                          className="px-4 py-2 bg-slate-900 text-white rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm hover:bg-black transition-all"
                          >
                          🎯 Draft SMART Goal
                        </button>

                        <button onClick={() => callAI('wordlist', m)} disabled={isGenerating} className="px-5 py-2.5 bg-purple-600 text-white rounded-xl font-black text-[9px] uppercase tracking-widest shadow-sm">
                          📚 Word List: /{m}/
                        </button>

                        <button 
                          onClick={() => callAI('anchor', m)} 
                          className="px-4 py-2 bg-rose-50 dark:bg-rose-900/20 text-rose-600 border border-rose-200 rounded-xl font-black text-[9px] uppercase tracking-widest"
                        >
                          🎨 Anchor Chart: /{m}/
                        </button>

                      </div>
                      ))}
                    </div>

                  {isGenerating && <div className="mt-6 text-blue-600 animate-pulse font-black uppercase text-[10px] tracking-widest">Generating...</div>}
                  {aiResponse && (
                    <div className="mt-6 bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl whitespace-pre-line text-sm border dark:border-gray-700 border-t-4 border-t-blue-500 relative">
                      <div className="flex justify-between items-center mb-4 no-print">
                        <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest">Output</span>
                        <div className="flex gap-2">
                          <button onClick={copyToClipboard} className={`px-3 py-1 rounded-lg text-[9px] font-black uppercase ${copied ? 'bg-emerald-500 text-white' : 'bg-gray-100 dark:bg-gray-800'}`}>
                              {copied ? 'Copied!' : 'Copy'}
                          </button>
                          <button onClick={() => setAiResponse("")} className="text-gray-400 hover:text-red-500 font-bold">×</button>
                        </div>
                      </div>
                      {aiResponse}
                    </div>
                  )}
                </div>
              ) : (
                <div className="p-8 border-2 border-dashed dark:border-gray-800 rounded-[2rem] text-center mb-10">
                  <button onClick={() => setStep('ai-setup')} className="text-blue-500 font-bold text-sm hover:underline italic tracking-tight">Connect OpenRouter to enable AI Co-Pilot</button>
                </div>
              )}

              <div className="mb-12">
                <h4 className="text-[10px] font-black uppercase text-gray-400 mb-6 tracking-widest px-1">Growth History</h4>
                <div className="bg-gray-50 dark:bg-gray-800/40 p-8 rounded-[2rem] border dark:border-gray-700 relative overflow-visible">
                  <svg viewBox="0 0 400 100" className="w-full h-32 overflow-visible">
                    <path d={selectedStudent.history.map((v, i) => `${i === 0 ? 'M' : 'L'} ${(i * 100)},${100 - v}`).join(' ')} fill="none" stroke="#3b82f6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
                    {selectedStudent.history.map((v, i) => (
                      <g key={i}>
                        <circle cx={i*100} cy={100-v} r="5" fill="#3b82f6" className="cursor-pointer transition-all hover:r-7"/>
                        <text x={i*100} y={100-v-15} textAnchor="middle" fontSize="10" fontWeight="bold" fill="currentColor">{v}%</text>
                      </g>
                    ))}
                  </svg>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                  <p className="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-tighter">Current Mastery</p>
                  <p className="text-4xl font-black">{Math.round(selectedStudent.accuracy * 100)}%</p>
                  <div className="w-full h-2 bg-gray-100 dark:bg-gray-800 mt-4 rounded-full overflow-hidden">
                    <div className="h-full bg-emerald-500" style={{width: `${selectedStudent.accuracy * 100}%`}}></div>
                  </div>
                </div>
                <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                  <p className="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-tighter">Volume</p>
                  <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
                  <p className="text-[10px] font-bold text-gray-400 mt-2 uppercase">Words Tracked</p>
                </div>
                <div className="p-8 border-2 dark:border-gray-800 rounded-[2rem]">
                  <p className="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-tighter">Status</p>
                  <p className={`text-2xl font-black uppercase italic ${selectedStudent.accuracy < 0.6 ? 'text-red-500' : 'text-emerald-500'}`}>
                    {selectedStudent.accuracy < 0.6 ? '⚠️ Review' : '📈 On Track'}
                  </p>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
