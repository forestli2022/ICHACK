<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, commonMistakes: ["th","sh","r"], wordsPracticed: 120, trend: 'up' },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.65, commonMistakes: ["s","ch","l"], wordsPracticed: 95, trend: 'down' },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, commonMistakes: ["r","l","ed"], wordsPracticed: 150, trend: 'up' },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, commonMistakes: ["a","i","o"], wordsPracticed: 110, trend: 'stable' },
  { id: 5, name: "Eva Patel", progress: 0.82, accuracy: 0.90, commonMistakes: ["th","s"], wordsPracticed: 140, trend: 'up' },
  { id: 6, name: "Frank Lopez", progress: 0.49, accuracy: 0.48, commonMistakes: ["ch","r"], wordsPracticed: 80, trend: 'down' },
];

function App() {
  const [students, setStudents] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [viewMode, setViewMode] = useState('students'); // 'students' or 'groups'
  const [sortBy, setSortBy] = useState('name');

  const selectedStudent = students.find(s => s.id === selectedId);

  // FEATURE 1: At-Risk Sorting
  const sortedStudents = useMemo(() => {
    let list = [...students];
    if (sortBy === 'accuracy') return list.sort((a, b) => a.accuracy - b.accuracy);
    return list.sort((a, b) => a.name.localeCompare(b.name));
  }, [students, sortBy]);

  // FEATURE 5: Group by Weakness
  const groups = useMemo(() => {
    const map = {};
    students.forEach(s => {
      s.commonMistakes.forEach(mistake => {
        if (!map[mistake]) map[mistake] = [];
        map[mistake].push(s.name);
      });
    });
    return map;
  }, [students]);

  // FEATURE 4: Parent Report Generator
  const copyParentReport = () => {
    const report = `Hi! ${selectedStudent.name} is making progress. Current accuracy is ${Math.round(selectedStudent.accuracy*100)}%. We are focusing on: ${selectedStudent.commonMistakes.join(', ')}. Keep up the great work!`;
    navigator.clipboard.writeText(report);
    alert("Report copied to clipboard!");
  };

  const getStatusColor = (acc) => {
    if (acc < 0.6) return "bg-red-500";
    if (acc < 0.8) return "bg-yellow-500";
    return "bg-green-500";
  };

  return (
    <div className="max-w-6xl mx-auto p-6 font-sans">
      <header className="flex justify-between items-center mb-8 border-b pb-4">
        <div>
          <h1 className="text-3xl font-bold text-gray-800">Class Insight</h1>
          <p className="text-gray-500 text-sm">Actionable data for focused teaching</p>
        </div>
        <div className="flex gap-2">
          <button 
            onClick={() => setViewMode('students')}
            className={`px-4 py-2 rounded-lg ${viewMode === 'students' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
          >Individual</button>
          <button 
            onClick={() => setViewMode('groups')}
            className={`px-4 py-2 rounded-lg ${viewMode === 'groups' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
          >Group Planner</button>
        </div>
      </header>

      <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
        {/* Sidebar / List */}
        <aside className="md:col-span-4 lg:col-span-3">
          <div className="mb-4 flex items-center justify-between text-xs font-bold text-gray-400 uppercase tracking-widest">
            <span>Students</span>
            <select className="bg-transparent" onChange={(e) => setSortBy(e.target.value)}>
              <option value="name">Sort A-Z</option>
              <option value="accuracy">Sort by Need</option>
            </select>
          </div>
          <div className="space-y-2">
            {sortedStudents.map(s => (
              <button 
                key={s.id}
                onClick={() => { setSelectedId(s.id); setViewMode('students'); }}
                className={`w-full flex items-center p-3 rounded-xl border transition-all ${selectedId === s.id && viewMode === 'students' ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-gray-100 hover:bg-gray-50'}`}
              >
                <div className={`w-3 h-3 rounded-full mr-3 ${getStatusColor(s.accuracy)}`}></div>
                <span className="flex-1 text-left font-medium">{s.name}</span>
                <span className="text-xs text-gray-400">{Math.round(s.accuracy*100)}%</span>
              </button>
            ))}
          </div>
        </aside>

        {/* Main Content Area */}
        <main className="md:col-span-8 lg:col-span-9 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          {viewMode === 'students' ? (
            <div>
              <div className="flex justify-between items-start mb-6">
                <div>
                  <h2 className="text-2xl font-bold">{selectedStudent.name}</h2>
                  <div className="flex items-center gap-2 mt-1">
                    {/* FEATURE 2: Trends */}
                    <span className="text-sm font-medium text-gray-500">Last 5 Days:</span>
                    <span className={`text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1 ${
                      selectedStudent.trend === 'up' ? 'bg-green-100 text-green-700' : 
                      selectedStudent.trend === 'down' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'
                    }`}>
                      {selectedStudent.trend === 'up' ? '▲ Improving' : selectedStudent.trend === 'down' ? '▼ Declining' : '● Stable'}
                    </span>
                  </div>
                </div>
                <button onClick={copyParentReport} className="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700">
                  Copy Parent Update
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
                <div className="p-4 bg-gray-50 rounded-xl">
                  <p className="text-sm text-gray-500 mb-1">Accuracy Score</p>
                  <p className="text-3xl font-bold">{Math.round(selectedStudent.accuracy*100)}%</p>
                </div>
                <div className="p-4 bg-gray-50 rounded-xl">
                  <p className="text-sm text-gray-500 mb-1">Total Words</p>
                  <p className="text-3xl font-bold">{selectedStudent.wordsPracticed}</p>
                </div>
              </div>

              {/* FEATURE 3: Actionable Intervention */}
              <h3 className="font-bold text-gray-800 mb-3">Intervention Needed</h3>
              <div className="flex flex-wrap gap-2">
                {selectedStudent.commonMistakes.map(mistake => (
                  <button key={mistake} className="group relative flex items-center gap-2 px-4 py-2 bg-white border border-red-200 rounded-lg text-red-700 hover:bg-red-50 transition-colors">
                    <span className="font-mono font-bold">/{mistake}/</span>
                    <span className="text-xs font-semibold uppercase tracking-tighter">Assign Practice</span>
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <h2 className="text-2xl font-bold mb-6">Small Group Planner</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {Object.entries(groups).map(([sound, names]) => (
                  <div key={sound} className="p-4 border border-gray-100 rounded-xl bg-blue-50/50">
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="font-bold text-blue-800 text-lg uppercase font-mono">/{sound}/ Phonics</h4>
                      <span className="bg-blue-200 text-blue-800 text-xs px-2 py-1 rounded-full">{names.length} Students</span>
                    </div>
                    <ul className="space-y-1">
                      {names.map(n => <li key={n} className="text-gray-700">• {n}</li>)}
                    </ul>
                  </div>
                ))}
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
