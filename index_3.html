<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard</title>
  <script>
    window.tailwindConfig = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, commonMistakes: ["th","sh","r"], wordsPracticed: 120, trend: 'up' },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.65, commonMistakes: ["s","ch","l"], wordsPracticed: 95, trend: 'down' },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, commonMistakes: ["r","l","ed"], wordsPracticed: 150, trend: 'up' },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, commonMistakes: ["a","i","o"], wordsPracticed: 110, trend: 'stable' },
  { id: 5, name: "Eva Patel", progress: 0.82, accuracy: 0.90, commonMistakes: ["th","s"], wordsPracticed: 140, trend: 'up' },
  { id: 6, name: "Frank Lopez", progress: 0.49, accuracy: 0.48, commonMistakes: ["ch","r"], wordsPracticed: 80, trend: 'down' },
];

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [lastLogin, setLastLogin] = useState(null);
  const [students] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [viewMode, setViewMode] = useState('students');
  const [sortBy, setSortBy] = useState('name');
  const [searchQuery, setSearchQuery] = useState("");
  
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  useEffect(() => {
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [darkMode]);

  useEffect(() => {
    const body = document.body;
    body.classList.remove('protanopia', 'deuteranopia', 'tritanopia');
    if (colorblindMode !== 'normal') body.classList.add(colorblindMode);
  }, [colorblindMode]);

  const handleSignIn = () => {
    const now = new Date();
    setLastLogin(now.toLocaleString('en-US', { 
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
    }));
    setIsLoggedIn(true);
  };

  const filteredAndSortedStudents = useMemo(() => {
    let list = students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));
    if (sortBy === 'accuracy') return list.sort((a, b) => a.accuracy - b.accuracy);
    return list.sort((a, b) => a.name.localeCompare(b.name));
  }, [students, sortBy, searchQuery]);

  const groups = useMemo(() => {
    const map = {};
    students.forEach(s => {
      s.commonMistakes.forEach(mistake => {
        if (!map[mistake]) map[mistake] = [];
        map[mistake].push(s.name);
      });
    });
    return map;
  }, [students]);

  const getStatusColor = (acc) => {
    if (acc < 0.6) return "bg-red-500";
    if (acc < 0.8) return "bg-amber-500";
    return "bg-emerald-500";
  };

  if (!isLoggedIn) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="max-w-md w-full bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-xl border dark:border-gray-800 text-center">
          <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white text-3xl font-black italic shadow-lg shadow-blue-500/20">P</div>
          <h2 className="text-3xl font-bold mb-2">Welcome Back</h2>
          <p className="text-gray-500 dark:text-gray-400 mb-8">Sign in to manage your phonics class</p>
          <div className="space-y-3">
            <button onClick={handleSignIn} className="w-full py-3.5 bg-white dark:bg-gray-800 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-750 transition-all border-b-4 active:border-b-2 active:translate-y-0.5">
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" className="w-5 h-5" />
              Sign in with Google
            </button>
            <button onClick={handleSignIn} className="w-full py-3.5 bg-white dark:bg-gray-800 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-750 transition-all border-b-4 active:border-b-2 active:translate-y-0.5">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" className="w-5 h-5" />
              Sign in with Microsoft
            </button>
            <div className="py-2 flex items-center gap-2 text-gray-400"><hr className="flex-1 dark:border-gray-800"/><span>OR</span><hr className="flex-1 dark:border-gray-800"/></div>
            <button onClick={handleSignIn} className="w-full py-3.5 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-500/30">
              Sign in with Email
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontSize }} className="max-w-6xl mx-auto p-4 md:p-8">
      <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b dark:border-gray-800 pb-6">
        <div>
          <h1 className="text-3xl font-black tracking-tight">Teacher Console</h1>
          <div className="flex items-center gap-2 mt-1">
            <p className="text-gray-500 dark:text-gray-400 text-sm">Classroom Management</p>
            <span className="text-gray-300 dark:text-gray-700">•</span>
            <p className="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Last Session: {lastLogin}</p>
          </div>
        </div>
        
        <div className="flex flex-wrap items-center gap-3 bg-white dark:bg-gray-900 p-2 rounded-2xl shadow-sm border dark:border-gray-800">
           <div className="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1">
              <button onClick={() => setViewMode('students')} className={`px-4 py-1.5 text-xs rounded-lg transition-all ${viewMode === 'students' ? 'bg-white dark:bg-gray-700 shadow-sm font-bold' : 'text-gray-500'}`}>Individual</button>
              <button onClick={() => setViewMode('groups')} className={`px-4 py-1.5 text-xs rounded-lg transition-all ${viewMode === 'groups' ? 'bg-white dark:bg-gray-700 shadow-sm font-bold' : 'text-gray-500'}`}>Groups</button>
           </div>
           <div className="h-6 w-px bg-gray-200 dark:bg-gray-700 mx-1"></div>
           <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
             {darkMode ? '☀️' : '🌙'}
           </button>
           <button onClick={() => setIsLoggedIn(false)} className="ml-2 px-4 py-2 text-xs font-bold text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors">
             Sign Out
           </button>
        </div>
      </header>

      <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
        <aside className="md:col-span-4 lg:col-span-3">
          <div className="mb-4">
            <input 
              type="text" 
              placeholder="Search students..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full bg-white dark:bg-gray-900 border dark:border-gray-800 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            />
          </div>
          <div className="mb-4 flex items-center justify-between text-[10px] font-black text-gray-400 uppercase tracking-[0.2em]">
            <span>Active Roster</span>
            <select className="bg-transparent outline-none cursor-pointer hover:text-blue-500" onChange={(e) => setSortBy(e.target.value)}>
              <option value="name">Name A-Z</option>
              <option value="accuracy">Priority</option>
            </select>
          </div>
          <div className="space-y-1">
            {filteredAndSortedStudents.map(s => (
              <button key={s.id} onClick={() => { setSelectedId(s.id); setViewMode('students'); }}
                className={`w-full flex items-center p-3 rounded-xl border-2 transition-all ${selectedId === s.id && viewMode === 'students' ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-400' : 'border-transparent hover:bg-gray-100 dark:hover:bg-gray-900'}`}>
                <div className={`w-2.5 h-2.5 rounded-full mr-3 ${getStatusColor(s.accuracy)}`}></div>
                <span className="flex-1 text-left font-semibold">{s.name}</span>
              </button>
            ))}
            {filteredAndSortedStudents.length === 0 && <p className="text-xs text-center text-gray-500 py-4">No students found.</p>}
          </div>
        </aside>

        <main className="md:col-span-8 lg:col-span-9 bg-white dark:bg-gray-900 p-6 md:p-10 rounded-3xl shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-gray-800">
          {viewMode === 'students' ? (
            <div>
               <div className="flex flex-col sm:flex-row justify-between gap-4 mb-10">
                  <div>
                    <h2 className="text-4xl font-bold mb-2">{selectedStudent.name}</h2>
                    <span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${
                      selectedStudent.trend === 'up' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 
                      selectedStudent.trend === 'down' ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'
                    }`}>
                      {selectedStudent.trend === 'up' ? '▲ IMPROVING' : selectedStudent.trend === 'down' ? '▼ DECLINING' : '● STABLE'}
                    </span>
                  </div>
                  <button onClick={() => alert("Report Copied!")} className="h-fit px-6 py-3 bg-gray-900 dark:bg-blue-600 text-white rounded-2xl font-bold text-sm hover:scale-105 transition-transform active:scale-95">
                    Generate Parent Update
                  </button>
               </div>
               <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-10">
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Accuracy</p>
                    <p className="text-4xl font-black text-blue-600">{Math.round(selectedStudent.accuracy*100)}%</p>
                  </div>
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Progress</p>
                    <div className="w-full bg-gray-100 dark:bg-gray-800 h-3 rounded-full overflow-hidden mt-4">
                      <div className="bg-blue-500 h-full" style={{width: `${selectedStudent.progress*100}%`}}></div>
                    </div>
                  </div>
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Total Practice</p>
                    <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
                  </div>
               </div>
               <h3 className="text-lg font-bold mb-4">Intervention Path</h3>
               <div className="flex flex-wrap gap-3">
                  {selectedStudent.commonMistakes.map(m => (
                    <div key={m} className="flex items-center gap-3 pl-4 pr-2 py-2 bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-900/30 rounded-xl">
                      <span className="font-mono font-bold text-red-600">/{m}/</span>
                      <button className="bg-white dark:bg-gray-800 text-[10px] font-black px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-600 hover:text-white transition-colors">ASSIGN</button>
                    </div>
                  ))}
               </div>
            </div>
          ) : (
            <div>
              <h2 className="text-3xl font-bold mb-8 italic text-gray-300">Group Planner</h2>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {Object.entries(groups).map(([sound, names]) => (
                  <div key={sound} className="p-6 bg-gray-50 dark:bg-gray-800/50 rounded-3xl border-2 border-dashed border-gray-200 dark:border-gray-700">
                    <div className="flex justify-between items-center mb-4">
                      <h4 className="text-2xl font-mono font-bold">/{sound}/</h4>
                      <span className="text-xs font-bold bg-white dark:bg-gray-700 px-3 py-1 rounded-full border dark:border-gray-600">{names.length} Students</span>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {names.map(n => <span key={n} className="bg-white dark:bg-gray-900 px-3 py-1.5 rounded-lg text-sm font-medium border dark:border-gray-800">{n}</span>)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </main>
      </div>

      <footer className="mt-12 pt-8 border-t dark:border-gray-800 flex flex-wrap items-center justify-between gap-6 opacity-60 hover:opacity-100 transition-opacity">
        <div className="flex items-center gap-6">
          <div className="flex items-center gap-3">
            <label className="text-xs font-black uppercase tracking-tighter">Text Size</label>
            <select value={fontSize} onChange={e => setFontSize(e.target.value)} className="bg-transparent font-bold">
              <option value="14px">Small</option>
              <option value="16px">Standard</option>
              <option value="20px">Large</option>
            </select>
          </div>
          <div className="flex items-center gap-3">
            <label className="text-xs font-black uppercase tracking-tighter">Color Filter</label>
            <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-transparent font-bold">
              <option value="normal">None</option>
              <option value="protanopia">Protanopia</option>
              <option value="deuteranopia">Deuteranopia</option>
              <option value="tritanopia">Tritanopia</option>
            </select>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
