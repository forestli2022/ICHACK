<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pro Dashboard</title>
  <script>
    window.tailwindConfig = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .protanopia { filter: saturate(0.5) hue-rotate(-10deg); }
    .deuteranopia { filter: saturate(0.5) hue-rotate(10deg); }
    .tritanopia { filter: hue-rotate(180deg); }
    
    /* Accessibility fix for dropdowns */
    select option {
      background-color: white !important;
      color: black !important;
    }
    .dark select option {
      background-color: #1f2937 !important;
      color: white !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const initialStudents = [
  { id: 1, name: "Alice Johnson", progress: 0.78, accuracy: 0.82, commonMistakes: ["th","sh","r"], wordsPracticed: 120, trend: 'up', history: [65, 70, 68, 75, 82] },
  { id: 2, name: "Ben Carter", progress: 0.56, accuracy: 0.65, commonMistakes: ["s","ch","l"], wordsPracticed: 95, trend: 'down', history: [80, 75, 72, 68, 65] },
  { id: 3, name: "Clara Smith", progress: 0.91, accuracy: 0.88, commonMistakes: ["r","l","ed"], wordsPracticed: 150, trend: 'up', history: [70, 75, 80, 85, 88] },
  { id: 4, name: "Daniel Wu", progress: 0.67, accuracy: 0.73, commonMistakes: ["a","i","o"], wordsPracticed: 110, trend: 'stable', history: [72, 74, 73, 72, 73] },
  { id: 5, name: "Eva Patel", progress: 0.82, accuracy: 0.90, commonMistakes: ["th","s"], wordsPracticed: 140, trend: 'up', history: [80, 82, 85, 87, 90] },
  { id: 6, name: "Frank Lopez", progress: 0.49, accuracy: 0.48, commonMistakes: ["ch","r"], wordsPracticed: 80, trend: 'down', history: [60, 55, 52, 50, 48] },
];

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [lastLogin, setLastLogin] = useState(null);
  const [students] = useState(initialStudents);
  const [selectedId, setSelectedId] = useState(1);
  const [viewMode, setViewMode] = useState('students');
  const [sortBy, setSortBy] = useState('name');
  const [searchQuery, setSearchQuery] = useState("");
  
  const [darkMode, setDarkMode] = useState(false);
  const [fontSize, setFontSize] = useState("16px");
  const [colorblindMode, setColorblindMode] = useState("normal");

  const selectedStudent = students.find(s => s.id === selectedId);

  useEffect(() => {
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [darkMode]);

  useEffect(() => {
    const body = document.body;
    body.classList.remove('protanopia', 'deuteranopia', 'tritanopia');
    if (colorblindMode !== 'normal') body.classList.add(colorblindMode);
  }, [colorblindMode]);

  const handleSignIn = () => {
    const now = new Date();
    setLastLogin(now.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
    setIsLoggedIn(true);
  };

  const filteredAndSortedStudents = useMemo(() => {
    let list = students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));
    if (sortBy === 'accuracy') return list.sort((a, b) => a.accuracy - b.accuracy);
    return list.sort((a, b) => a.name.localeCompare(b.name));
  }, [students, sortBy, searchQuery]);

  const getStatusColor = (acc) => {
    if (acc < 0.6) return "bg-red-500";
    if (acc < 0.8) return "bg-amber-500";
    return "bg-emerald-500";
  };

  if (!isLoggedIn) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="max-w-md w-full bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-xl border dark:border-gray-800 text-center">
          <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white text-3xl font-black italic">P</div>
          <h2 className="text-3xl font-bold mb-8">Teacher Login</h2>
          <div className="space-y-3">
            <button onClick={handleSignIn} className="w-full py-3.5 bg-white dark:bg-gray-800 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-750 transition-all border-b-4 active:border-b-2">
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" className="w-5 h-5" /> Sign in with Google
            </button>
            <button onClick={handleSignIn} className="w-full py-3.5 bg-white dark:bg-gray-800 border-2 dark:border-gray-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-750 transition-all border-b-4 active:border-b-2">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" className="w-5 h-5" /> Sign in with Microsoft
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontSize }} className="max-w-6xl mx-auto p-4 md:p-8">
      {/* IMPROVED HEADER WITH TOP ACCESS OPTIONS */}
      <div className="bg-white dark:bg-gray-900 rounded-3xl p-4 shadow-sm border dark:border-gray-800 mb-8 flex flex-wrap items-center justify-between gap-4">
        <div className="flex flex-wrap items-center gap-4">
          <div className="flex items-center gap-2 border-r dark:border-gray-700 pr-4">
            <label className="text-[10px] font-black uppercase text-gray-400">Theme</label>
            <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
              {darkMode ? '☀️' : '🌙'}
            </button>
          </div>
          <div className="flex items-center gap-2 border-r dark:border-gray-700 pr-4">
            <label className="text-[10px] font-black uppercase text-gray-400">Font</label>
            <select value={fontSize} onChange={e => setFontSize(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-lg px-2 py-1 text-xs font-bold focus:ring-2 focus:ring-blue-500">
              <option value="14px text-black">Small</option>
              <option value="16px text-black">Standard</option>
              <option value="20px text-black">Large</option>
            </select>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-[10px] font-black uppercase text-gray-400">Filter</label>
            <select value={colorblindMode} onChange={e => setColorblindMode(e.target.value)} className="bg-gray-100 dark:bg-gray-800 rounded-lg px-2 py-1 text-xs font-bold focus:ring-2 focus:ring-blue-500">
              <option value="normal">Normal</option>
              <option value="protanopia">Protanopia</option>
              <option value="deuteranopia">Deuteranopia</option>
              <option value="tritanopia">Tritanopia</option>
            </select>
          </div>
        </div>
        <button onClick={() => setIsLoggedIn(false)} className="px-4 py-2 text-xs font-bold text-red-600 bg-red-50 dark:bg-red-900/10 rounded-xl hover:bg-red-100">Sign Out</button>
      </div>

      <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b dark:border-gray-800 pb-6">
        <div>
          <h1 className="text-3xl font-black tracking-tight">Teacher Console</h1>
          <p className="text-gray-500 text-sm">Last Session: {lastLogin}</p>
        </div>
        <div className="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1">
          <button onClick={() => setViewMode('students')} className={`px-4 py-1.5 text-xs rounded-lg ${viewMode === 'students' ? 'bg-white dark:bg-gray-700 shadow-sm font-bold' : ''}`}>Individual</button>
          <button onClick={() => setViewMode('groups')} className={`px-4 py-1.5 text-xs rounded-lg ${viewMode === 'groups' ? 'bg-white dark:bg-gray-700 shadow-sm font-bold' : ''}`}>Groups</button>
        </div>
      </header>

      <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
        <aside className="md:col-span-4 lg:col-span-3">
          <input type="text" placeholder="Search..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-white dark:bg-gray-900 border dark:border-gray-800 rounded-xl px-4 py-2 mb-4 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <div className="space-y-1">
            {filteredAndSortedStudents.map(s => (
              <button key={s.id} onClick={() => { setSelectedId(s.id); setViewMode('students'); }} className={`w-full flex items-center p-3 rounded-xl border-2 transition-all ${selectedId === s.id ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20' : 'border-transparent hover:bg-gray-100 dark:hover:bg-gray-900'}`}>
                <div className={`w-2.5 h-2.5 rounded-full mr-3 ${getStatusColor(s.accuracy)}`}></div>
                <span className="font-semibold">{s.name}</span>
              </button>
            ))}
          </div>
        </aside>

        <main className="md:col-span-8 lg:col-span-9 bg-white dark:bg-gray-900 p-6 md:p-10 rounded-3xl shadow-sm border dark:border-gray-800">
          {viewMode === 'students' ? (
            <div>
               <div className="flex flex-col sm:flex-row justify-between gap-4 mb-10">
                  <h2 className="text-4xl font-bold">{selectedStudent.name}</h2>
                  <button onClick={() => alert("Copied to Clipboard")} className="px-6 py-3 bg-blue-600 text-white rounded-2xl font-bold text-sm">Generate Parent Report</button>
               </div>

               {/* PROGRESS GRAPH SECTION */}
               <div className="mb-10 p-6 bg-gray-50 dark:bg-gray-800/50 rounded-2xl border dark:border-gray-700">
                 <h3 className="text-xs font-black uppercase text-gray-400 mb-6">Accuracy Trend (Last 5 Sessions)</h3>
                 <div className="flex items-end justify-between h-32 gap-2">
                    {selectedStudent.history.map((val, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center gap-2 group">
                        <div className="w-full bg-blue-500/20 dark:bg-blue-500/10 rounded-t-lg relative flex items-end overflow-hidden" style={{height: '100%'}}>
                          <div className="w-full bg-blue-600 transition-all duration-500 rounded-t-lg" style={{height: `${val}%`}}></div>
                        </div>
                        <span className="text-[10px] font-bold text-gray-500">{val}%</span>
                      </div>
                    ))}
                 </div>
               </div>

               <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Overall Accuracy</p>
                    <p className="text-4xl font-black text-blue-600">{Math.round(selectedStudent.accuracy*100)}%</p>
                  </div>
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Words Practiced</p>
                    <p className="text-4xl font-black">{selectedStudent.wordsPracticed}</p>
                  </div>
                  <div className="p-6 border dark:border-gray-800 rounded-2xl">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-2">Needs Help With</p>
                    <div className="flex flex-wrap gap-1 mt-2">
                      {selectedStudent.commonMistakes.map(m => <span key={m} className="bg-red-100 dark:bg-red-900/30 text-red-600 px-2 py-1 rounded text-xs font-bold">/{m}/</span>)}
                    </div>
                  </div>
               </div>
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <h2 className="col-span-full text-2xl font-bold mb-4">Small Group Planner</h2>
              {/* Groups logic here... */}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
